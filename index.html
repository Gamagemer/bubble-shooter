<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bubble Shooter — MVP 0.1</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111827;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body {
    display: grid;
    place-items: center;
  }
  #game {
    width: min(92vw, 430px);
    height: min(92vh, 760px);
    background: #f3f4f6;
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    overflow: hidden;
    position: relative;
  }
  #hud {
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    font-weight: 700;
    color: #111827;
  }
  #board {
    display: block;
    width: 100%;
    height: calc(100% - 58px);
    touch-action: none;
  }
  .hint {
    position: absolute;
    left: 50%;
    top: 70px;
    transform: translateX(-50%);
    color: #6b7280;
    font-size: 13px;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <span>🫧 Bubble Shooter</span>
    <span>Шаг 2 / 5</span>
  </div>
  <canvas id="board"></canvas>
  <div class="hint">Наводи мышь/палец и нажимай для выстрела</div>
</div>

<script>
(() => {
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");

  const COLORS = ["#ef4444", "#3b82f6", "#22c55e", "#f59e0b", "#a855f7"];
  const R = 17;
  const GAP = 2;
  const ROW_H = (R * 2 + GAP) * 0.866;

  let cols = 10;
  let rows = 8;
  let bubbles = [];
  let shooter = null;
  let mouse = { x: 0, y: 0 };
  let animationId = null;

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    cols = Math.max(7, Math.floor((rect.width - R * 2) / (R * 2 + GAP)));
    createBoard();
    setupShooter();
    draw();
  }

  function createBoard() {
    bubbles = [];
    const rect = canvas.getBoundingClientRect();

    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        if (row >= 5) continue;

        const x = R + col * (R * 2 + GAP) + (row % 2 ? R : 0);
        if (x + R > rect.width) continue;

        bubbles.push({
          row,
          col,
          x,
          y: 34 + row * ROW_H,
          color: COLORS[(row * 3 + col) % COLORS.length]
        });
      }
    }
  }

  function setupShooter() {
    const rect = canvas.getBoundingClientRect();
    shooter = {
      x: rect.width / 2,
      y: rect.height - 52,
      color: COLORS[1]
    };
    mouse.x = shooter.x;
    mouse.y = shooter.y - 100;
  }

  function drawBubble(b) {
    const g = ctx.createRadialGradient(
      b.x - R * .35, b.y - R * .4, R * .1,
      b.x, b.y, R
    );
    g.addColorStop(0, "#ffffff");
    g.addColorStop(.18, b.color);
    g.addColorStop(1, b.color);

    ctx.beginPath();
    ctx.arc(b.x, b.y, R, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(b.x - R * .35, b.y - R * .42, R * .18, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,.65)";
    ctx.fill();
  }

  function drawShooter() {
    if (!shooter) return;

    const dx = mouse.x - shooter.x;
    const dy = mouse.y - shooter.y;
    const angle = Math.atan2(dy, dx);

    // Прицел.
    ctx.save();
    ctx.setLineDash([7, 7]);
    ctx.strokeStyle = "rgba(17,24,39,.35)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(shooter.x, shooter.y);
    ctx.lineTo(
      shooter.x + Math.cos(angle) * 150,
      shooter.y + Math.sin(angle) * 150
    );
    ctx.stroke();
    ctx.restore();

    // Ствол.
    ctx.save();
    ctx.translate(shooter.x, shooter.y);
    ctx.rotate(angle);
    ctx.lineCap = "round";
    ctx.lineWidth = 10;
    ctx.strokeStyle = "#111827";
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, -30);
    ctx.stroke();
    ctx.restore();

    // Основание.
    ctx.beginPath();
    ctx.arc(shooter.x, shooter.y, 24, 0, Math.PI * 2);
    ctx.fillStyle = "#374151";
    ctx.fill();

    // Следующий шар.
    ctx.fillStyle = "#6b7280";
    ctx.font = "12px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("Следующий", shooter.x, shooter.y + 45);
    drawBubble({
      x: shooter.x,
      y: shooter.y + 64,
      color: COLORS[2]
    });
  }

  function draw() {
    const rect = canvas.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);

    ctx.fillStyle = "#e5e7eb";
    ctx.fillRect(0, 0, rect.width, rect.height);

    ctx.strokeStyle = "rgba(255,255,255,.45)";
    ctx.lineWidth = 1;

    for (let x = 0; x < rect.width; x += 32) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, rect.height);
      ctx.stroke();
    }

    for (let y = 0; y < rect.height; y += 32) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(rect.width, y);
      ctx.stroke();
    }

    bubbles.forEach(drawBubble);
    drawShooter();
  }

  function updatePointer(e) {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;

    // Не даём целиться ниже пушки.
    if (mouse.y > shooter.y - 10) mouse.y = shooter.y - 10;
    draw();
  }

  function shoot() {
    if (!shooter || animationId) return;

    const dx = mouse.x - shooter.x;
    const dy = mouse.y - shooter.y;

    // Запрещаем почти вертикальное движение вниз.
    if (dy > -15) return;

    const length = Math.hypot(dx, dy) || 1;
    const vx = dx / length;
    const vy = dy / length;

    const projectile = {
      x: shooter.x,
      y: shooter.y,
      vx: vx * 8,
      vy: vy * 8,
      color: shooter.color
    };

    function animate() {
      projectile.x += projectile.vx;
      projectile.y += projectile.vy;

      const rect = canvas.getBoundingClientRect();

      // Отскок от боковых стен.
      if (projectile.x - R <= 0) {
        projectile.x = R;
        projectile.vx *= -1;
      }
      if (projectile.x + R >= rect.width) {
        projectile.x = rect.width - R;
        projectile.vx *= -1;
      }

      // Верхняя граница — пока просто останавливаем шар.
      if (projectile.y - R <= 0) {
        projectile.y = R;
        finishShot(projectile);
        return;
      }

      // Столкновение с любым шариком.
      for (const b of bubbles) {
        if (Math.hypot(projectile.x - b.x, projectile.y - b.y) <= R * 2 - 1) {
          finishShot(projectile, b);
          return;
        }
      }

      draw();
      drawBubble(projectile);
      animationId = requestAnimationFrame(animate);
    }

    animationId = requestAnimationFrame(animate);
  }

  function finishShot(projectile, hitBubble) {
    if (animationId) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }

    // Шаг 1: пока просто размещаем шарик рядом с местом столкновения.
    let x = projectile.x;
    let y = projectile.y;

    if (hitBubble) {
      const dx = projectile.x - hitBubble.x;
      const dy = projectile.y - hitBubble.y;
      const len = Math.hypot(dx, dy) || 1;
      x = hitBubble.x + (dx / len) * (R * 2 + GAP);
      y = hitBubble.y + (dy / len) * (R * 2 + GAP);
    }

    bubbles.push({
      x,
      y,
      color: projectile.color,
      row: -1,
      col: -1
    });

    // Следующий шарик.
    shooter.color = COLORS[Math.floor(Math.random() * COLORS.length)];

    draw();
  }

  canvas.addEventListener("pointermove", updatePointer);
  canvas.addEventListener("pointerdown", (e) => {
    updatePointer(e);
    shoot();
  });

  window.addEventListener("resize", resize);
  resize();
})();
</script>
</body>
</html>
